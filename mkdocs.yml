markdown_extensions:
  - toc:
      permalink: true
  ## admonitions
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  ## content tabs
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  ## grid
  - attr_list
  - md_in_html      
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # 保留原配置的所有扩展
  - abbr
  - def_list
  - footnotes
  - meta
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.saneheaders
  - pymdownx.magiclink:
      repo_url_shortener: true
      repo_url_shorthand: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  1Panel:
    tag: v1.10.29
  search:
    separator: '[\s\-\.]+'
    language: 'en'
    Content-Encoding: gzip
    boost: 100
  generator: false
  version:
    provider: mike
  analytics:
    provider: google
    property: G-1QN949WS47
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/1Panel-dev/1Panel
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/1panel_linux
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@1Panel-linux
    - icon: fontawesome/brands/discord
      link: https://discord.gg/bUpUqWqdRr

extra_css:
  - stylesheets/extra.css    
  - css/extra.css
  - css/termynal.css
  - css/custom.css

extra_javascript:
  - js/termynal.js
  - js/custom.js

plugins:
  - glightbox
  - search:
      lang:
        - en
        - ja
      separator: '[\s\-\.]+'
