## basic info
site_name: "1Panel Documentation"
site_url: "https://docs.1panel.pro"
site_description: "1Panel Open-source Linux Server Operation & Management Panel"
site_author: "1Panel"
repo_name: "1Panel"
repo_url: "https://github.com/1Panel-dev/1Panel"
edit_uri: https://github.com/1Panel-dev/docs/edit/i18n/docs/
copyright: Copyright &copy; 2025 Lingxia (Hong Kong) Software Co., Limited, All Rights Reserved.

## customization
theme:
  name: "material"
  logo: "img/logo-white.png"
  favicon: "img/facio.ico"
  language: "en"
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
  font:
    text: Roboto
    code: Roboto Mono
  custom_dir: "theme"
  icon:
    repo: fontawesome/brands/github

