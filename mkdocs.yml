site_name: '1Panel 文档'
site_url: 'https://1panel.cn/docs'
site_author: '飞致云'
site_description: "1Panel 在线使用文档"

repo_name: '1Panel-dev/1Panel'
repo_url: 'https://github.com/1Panel-dev/1Panel'
edit_uri: ''

theme:
  name: 'material'
  logo: 'img/logo-white.png'
  favicon: 'img/facio.ico'
  language: 'zh'
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
  font: false
  custom_dir: 'theme'
  icon:
    repo: fontawesome/brands/github

